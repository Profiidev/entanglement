[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
centaurus = { version = "0.4.11", default-features = false, features = [
  "serde",
  "error",
  "url",
  "logging",
  "serde_json",
  "reqwest",
] }
dirs = "6.0.0"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json", "form", "http3"] }
ratatui = "0.30.0"
tui-input = "0.15.0"
opener = "0.8.4"
