name: 'App build and release'

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  build-app:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --linux --package-types "appimage"
            bundle: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --windows --package-types "msi"
            bundle: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --macos --package-types "dmg"
            bundle: macos

    steps:
      - uses: actions/checkout@v6

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
          version: 1.0

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_cache-${{ matrix.platform }}'

      - name: Install dx
        if: matrix.os != 'windows-latest'
        run: |
          curl -o dx.tar.gz -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-${{ matrix.target }}.tar.gz
          tar -xzf dx.tar.gz -C /usr/local/bin
          rm dx.tar.gz

      - name: Install dx (windows)
        if: matrix.os == 'windows-latest'
        run: |
          curl -o dx.zip -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-${{ matrix.target }}.zip
          tar -xf dx.zip -C C:\dx
          del dx.zip
          echo "C:\dx" >> $GITHUB_PATH

      - name: Build app
        run: cd app && cargo build --release && dx bundle --release --verbose ${{ matrix.args }} && mv ../target/dx/app/bundle/${{ matrix.bundle }}/* .. && ls -la ..
