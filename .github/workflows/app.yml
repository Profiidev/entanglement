name: 'App build and release'

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  build-app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --linux --package-types "appimage"
            bundle: linux/appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --windows --package-types "msi"
            bundle: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --macos --package-types "dmg"
            bundle: macos/macos
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            args: --android --package-types "apk"
            bundle: android/android

    steps:
      - uses: actions/checkout@v6

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libglib2.0-dev
          version: 1.0

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_cache-${{ matrix.platform }}'

      - name: Install dx
        if: matrix.os != 'windows-latest'
        run: |
          curl -o dx.tar.gz -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-${{ matrix.target }}.tar.gz
          tar -xzf dx.tar.gz -C /usr/local/bin
          rm dx.tar.gz

      - name: Install dx (windows)
        if: matrix.os == 'windows-latest'
        run: |
          curl -o dx.zip -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-${{ matrix.target }}.zip
          Expand-Archive -Path dx.zip -DestinationPath "$env:USERPROFILE\bin"
          echo "$env:USERPROFILE\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Remove-Item dx.zip

      - name: Build app
        run: cd app && cargo build --release && dx bundle --release --verbose ${{ matrix.args }} && mv ../target/dx/app/bundle/${{ matrix.bundle }}/* . && ls -la .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: entanglement-${{ matrix.target }}
          path: |
            *.dmg
            *.msi
            *.AppImage
            *.apk
