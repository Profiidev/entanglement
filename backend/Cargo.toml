[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
centaurus = { version = "0.4.13", features = [
  "axum",
  "logging",
  "sea-orm",
  "uuid",
  "reqwest",
  "jsonwebtoken",
  "image",
  "auth",
] }
uuid = { version = "1.23.0", features = ["v4"] }
entity = { path = "entity" }
migration = { path = "migration" }
sea-orm = { version = "1.1.20", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
axum = { version = "0.8.8", features = ["macros", "ws", "tracing"] }
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header"] }
tracing = "0.1.44"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tokio = { version = "1.50.0", features = ["signal"] }
http = "1.4.0"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
figment = { version = "0.10.19", features = ["env"] }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
url = { version = "2.5.8", features = ["serde"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.2", features = ["json", "form", "http3"] }
rsa = "0.9.10"
tower_governor = { version = "0.8.0", features = ["axum"] }
chrono = "0.4.44"
serde_json = "1.0.149"
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
base64 = "0.22.1"
md5 = "0.8.0"
governor = "0.10.4"
time = "0.3.47"
dashmap = "6.1.0"

[[bin]]
name = "backend"
path = "src/main.rs"
